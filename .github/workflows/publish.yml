name: Publish
# Create a tag like v0.1.0 to publish to nuget.org via Trusted Publishing (OIDC, no stored API key).
# Setup: a Trusted Publishing policy on nuget.org for this repo + workflow file (publish.yml),
# and a repository variable NUGET_USER with your nuget.org username.
# Can also be run by hand from the Actions tab (Run workflow) with an explicit version; that run
# also creates the vX.Y.Z tag and GitHub release (with the .nupkg files attached).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish (e.g. 0.1.0)
        required: true
permissions:
  id-token: write
  contents: write # create the tag/release on manual runs
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: 8.0.x }
      - run: dotnet test -c Release
      - name: Pack with tag version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          dotnet pack -c Release -o artifacts -p:Version="$version"
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # dotnet nuget push does not expand a quoted glob on Windows; let bash expand it.
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*.nupkg --clobber
          else
            gh release create "$tag" artifacts/*.nupkg --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
